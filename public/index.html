<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#183b36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UricAcid" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>UricAcid · 个人观测台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <section id="gate" class="gate-shell">
      <div class="gate-card">
        <div class="gate-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="eyebrow">PRIVATE OBSERVATION DESK</p>
        <h1>把每天的记录，<em>留在自己手里。</em></h1>
        <p class="gate-copy">这里记录膳食嘌呤估算、饮品容量和真实测量的血尿酸。它是个人回看工具，不是诊断或治疗系统。</p>
        <form id="login-form" class="login-form">
          <label for="login-password">共享访问口令</label>
          <div class="password-row">
            <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="输入口令" aria-describedby="login-message" />
            <button class="button button-primary" type="submit">进入记录</button>
          </div>
          <p id="login-message" class="form-hint" role="alert"></p>
        </form>
        <div class="gate-note"><span class="status-dot"></span> 设备验证成功后默认保持 365 天可信</div>
      </div>
      <div class="gate-orbit orbit-one"></div><div class="gate-orbit orbit-two"></div>
    </section>

    <div id="app" class="app-shell hidden">
      <aside id="sidebar" class="sidebar">
        <div class="brand-lockup">
          <div class="brand-symbol"><span></span><span></span><span></span></div>
          <div><strong>UricAcid</strong><small>个人观测台</small></div>
        </div>
        <div class="side-rule"></div>
        <nav class="main-nav" aria-label="主要导航">
          <a href="#today" data-route="today" class="nav-item active" aria-current="page"><span class="nav-index">01</span><span class="nav-label">今日</span><small>快速记录</small></a>
          <a href="#treatment" data-route="treatment" class="nav-item"><span class="nav-index">02</span><span class="nav-label">治疗记录</span><small>过程时间线</small></a>
          <a href="#history" data-route="history" class="nav-item"><span class="nav-index">03</span><span class="nav-label">历史</span><small>按日回看</small></a>
          <a href="#stats" data-route="stats" class="nav-item"><span class="nav-index">04</span><span class="nav-label">统计</span><small>趋势与同期</small></a>
          <a href="#manage" data-route="manage" class="nav-item"><span class="nav-index">05</span><span class="nav-label">管理</span><small>资料与数据</small></a>
        </nav>
        <div class="side-footer">
          <div class="side-metric"><span>数据空间</span><strong>单一 · 私密</strong></div>
          <button id="logout-button" class="text-button">退出当前设备</button>
        </div>
      </aside>
      <button id="mobile-menu-backdrop" class="mobile-menu-backdrop" type="button" aria-label="关闭菜单" aria-hidden="true"></button>
      <main id="main-content" class="main-content" tabindex="-1">
        <header class="topbar">
          <button id="mobile-menu" class="icon-button menu-button" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">☰</button>
          <div class="topbar-title"><span id="page-kicker">TODAY / DAILY LOG</span><h2 id="page-title">今日</h2></div>
          <div class="topbar-actions"><span id="save-status" class="save-status" role="status" aria-live="polite">已连接</span><button id="refresh-button" class="icon-button" type="button" aria-label="刷新当前页面">↻</button></div>
        </header>
        <div id="view" class="view-container"></div>
      </main>
      <nav class="bottom-nav" aria-label="移动端主要导航">
        <a href="#today" data-route="today" class="bottom-nav-item active" aria-current="page"><span aria-hidden="true">◌</span><small>今日</small></a>
        <a href="#treatment" data-route="treatment" class="bottom-nav-item"><span aria-hidden="true">✦</span><small>治疗</small></a>
        <a href="#history" data-route="history" class="bottom-nav-item"><span aria-hidden="true">↺</span><small>历史</small></a>
        <a href="#stats" data-route="stats" class="bottom-nav-item"><span aria-hidden="true">⌁</span><small>统计</small></a>
        <a href="#manage" data-route="manage" class="bottom-nav-item"><span aria-hidden="true">⊙</span><small>管理</small></a>
      </nav>
    </div>

    <div id="modal-root"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
